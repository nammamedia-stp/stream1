# ==============================================================================
# StreamPulse Kiosk Suite - Configuration File
# Location: /opt/streampulse/config/kiosk.conf
# Target OS: Debian 13 (Trixie) ARM64 / Labwc Desktop Environment
# ==============================================================================

# Target Dashboard URL to display in fullscreen kiosk
DASHBOARD_URL="http://187.127.210.81/"

# Dedicated User Account
KIOSK_USER="himakara"

# Dedicated Browser Profile Directory (prevents keyring & profile collision)
BROWSER_PROFILE_DIR="/opt/streampulse/chromium-profile"

# Browser Selection: "auto" (prefers chromium, falls back to firefox), "chromium", "firefox"
BROWSER_ENGINE="auto"

# Display settings
SCREEN_WIDTH=1920
SCREEN_HEIGHT=1080
HIDE_CURSOR=1
DISABLE_SCREEN_BLANKING=1

# Network wait timeout in seconds before fallback loop
WAIT_NETWORK_TIMEOUT=30

# Restart delay in seconds if browser exits
RESTART_DELAY_SEC=3

# Keyring & Chromium Optimization Flags
# IMPORTANT: --password-store=basic prevents the "Unlock Keyring" / "Default Keyring" popup
CHROMIUM_EXTRA_FLAGS=(
  "--password-store=basic"
  "--noerrdialogs"
  "--disable-infobars"
  "--kiosk"
  "--start-fullscreen"
  "--fullscreen"
  "--no-first-run"
  "--disable-restore-session-state"
  "--disable-session-crashed-bubble"
  "--autoplay-policy=no-user-gesture-required"
  "--check-for-update-interval=31536000"
  "--disable-component-update"
  "--disable-features=TranslateUI"
  "--disable-save-password-bubble"
  "--allow-file-access-from-files"
  "--disable-web-security"
  "--disable-gpu"
  "--window-position=0,0"
  "--window-size=1920,1080"
)
