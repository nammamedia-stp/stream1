# ==============================================================================
# StreamPulse Master Kiosk & Player Suite - Configuration
# Target Location: /opt/streampulse/config/kiosk.conf
# Target OS: Raspberry Pi OS 64-bit / Debian 13 (Trixie) ARM64
# Desktop Environment: Labwc (Wayland Session)
# Target User: himakara
# ==============================================================================

# Target Dashboard URL to display in fullscreen kiosk
DASHBOARD_URL="http://187.127.210.81/"

# Target Stream Key for StreamPulse Player
STREAM_KEY="live_stream"

# StreamPulse Server Host URL
SERVER_URL="http://187.127.210.81"

# Dedicated Linux User Account
KIOSK_USER="himakara"

# Dedicated Browser Profile Directory (prevents keyring & user profile collisions)
BROWSER_PROFILE_DIR="/opt/streampulse/chromium-profile"

# Browser Selection: "auto" (prefers chromium, falls back to firefox), "chromium", "firefox"
BROWSER_ENGINE="auto"

# Display & Screen Settings
SCREEN_WIDTH=1920
SCREEN_HEIGHT=1080
HIDE_CURSOR=1
DISABLE_SCREEN_BLANKING=1

# Network wait timeout in seconds before browser fallback launch
WAIT_NETWORK_TIMEOUT=30

# Restart delay in seconds if browser process exits
RESTART_DELAY_SEC=3

# Local Motion Logo Path
MOTION_LOGO_PATH="/opt/streampulse/media/motion_logo.mp4"

# Keyring & Chromium Optimization Flags
# CRITICAL: --password-store=basic prevents the GNOME/KDE keyring unlock prompt
CHROMIUM_EXTRA_FLAGS=(
  "--password-store=basic"
  "--noerrdialogs"
  "--disable-infobars"
  "--kiosk"
  "--start-fullscreen"
  "--fullscreen"
  "--no-first-run"
  "--disable-restore-session-state"
  "--disable-session-crashed-bubble"
  "--autoplay-policy=no-user-gesture-required"
  "--enable-accelerated-video-decode"
  "--enable-gpu-rasterization"
  "--enable-zero-copy"
  "--ignore-gpu-blocklist"
  "--check-for-update-interval=31536000"
  "--disable-component-update"
  "--disable-features=TranslateUI"
  "--disable-save-password-bubble"
  "--allow-file-access-from-files"
  "--disable-web-security"
  "--window-position=0,0"
  "--window-size=1920,1080"
)
