# StreamPulse Kiosk & Dashboard Configuration
# Managed by StreamPulse Universal Installer
# Path: /opt/streampulse/config/kiosk.conf

# Target Dashboard URL to load in Fullscreen
DASHBOARD_URL="http://187.127.210.81/"

# Dedicated Chromium profile directory (Prevents keyring / password popups)
BROWSER_PROFILE_DIR="/opt/streampulse/chromium-profile"

# Browser Engine Mode (auto / chromium / chromium-browser)
BROWSER_ENGINE="auto"

# Display & Screen Settings
SCREEN_WIDTH=1920
SCREEN_HEIGHT=1080
HIDE_CURSOR=1
DISABLE_SCREEN_BLANKING=1

# Network & Connectivity
WAIT_NETWORK_TIMEOUT=30
RESTART_DELAY_SEC=3

# Keyring Suppression & Kiosk Flags (Strictly inside Chromium array)
CHROMIUM_EXTRA_FLAGS=(
  "--password-store=basic"
  "--noerrdialogs"
  "--disable-infobars"
  "--kiosk"
  "--start-fullscreen"
  "--fullscreen"
  "--no-first-run"
  "--disable-restore-session-state"
  "--disable-session-crashed-bubble"
  "--autoplay-policy=no-user-gesture-required"
  "--check-for-update-interval=31536000"
  "--disable-component-update"
  "--disable-features=TranslateUI"
  "--disable-save-password-bubble"
  "--allow-file-access-from-files"
  "--window-position=0,0"
  "--window-size=1920,1080"
)
