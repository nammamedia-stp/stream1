<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreamPulse Offline Logo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .pulse-ring {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-ring 2.8s infinite ease-in-out;
      margin-bottom: 28px;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.25);
    }
    .pulse-core {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }
    .brand-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .channel-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 6px 16px;
      border-radius: 9999px;
      color: #818cf8;
      font-size: 15px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-top: 8px;
    }
    .channel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f59e0b;
      animation: blink 1.2s infinite;
    }
    .status-message {
      color: #64748b;
      font-size: 14px;
      margin-top: 20px;
      letter-spacing: 0.02em;
    }
    @keyframes pulse-ring {
      0%, 100% {
        transform: scale(1);
        border-color: #6366f1;
        opacity: 0.8;
      }
      50% {
        transform: scale(1.1);
        border-color: #06b6d4;
        opacity: 1;
        box-shadow: 0 0 45px rgba(6, 182, 212, 0.4);
      }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="pulse-ring">
      <div class="pulse-core">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
    </div>
    <div class="brand-title">StreamPulse</div>
    <div id="channel-badge" class="channel-badge">
      <span class="channel-dot"></span>
      <span id="channel-name">Channel Standby</span>
    </div>
    <div id="status-message" class="status-message">Waiting for live broadcast stream...</div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const ch = params.get('channel') || params.get('channelName') || 'channel1';
      const el = document.getElementById('channel-name');
      if (el) el.textContent = 'Channel: ' + ch;
    })();
  </script>
</body>
</html>
