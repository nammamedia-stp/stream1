# StreamPulse Nginx RTMP & FFmpeg Transcoding Module Configuration

rtmp {
    server {
        listen 1935; # Standard RTMP port
        chunk_size 4096;

        # Fast connection health monitoring & instant disconnect cleanup (<2s recovery)
        timeout 5s;
        ping 3s;
        ping_timeout 3s;
        drop_idle_publisher on;
        idle_streams off;

        # Primary Live Stream Ingest Application
        # OBS publishes to rtmp://server/ingest/<stream_key>
        application ingest {
            live on;
            record off;

            # Stream synchronization and immediate keyframe delivery
            wait_key on;
            wait_video on;
            interleave on;
            publish_notify on;
            play_restart on;
            out_queue 4096;
            out_subqueue 512;

            # HTTP callbacks for StreamPulse server state tracking
            on_publish http://127.0.0.1:3000/api/rtmp/publish;
            on_publish_done http://127.0.0.1:3000/api/rtmp/publish_done;

            # Forward the incoming stream to the 'live' application for RTMP playback
            push rtmp://localhost/live;

            # Hand over incoming RTMP stream to FFmpeg for dynamic Multi-Bitrate HLS Transcoding
            # This triggers the custom transcode script to generate 1080p, 720p, 480p, and 360p HLS playlists
            exec_push /usr/local/bin/transcode.sh $name;
        }

        # Standalone Live application for playback/distribution (No transcoding hooks, no circular locks)
        application live {
            live on;
            record off;

            wait_key on;
            wait_video on;
            interleave on;
        }

        # Raw ingest application (optional, if you want direct playback without transcoding)
        application raw {
            live on;
            record off;
            wait_key on;
            wait_video on;
            
            # Enable HLS generation for raw input directly
            hls on;
            hls_path /var/www/hls/raw;
            hls_fragment 2;
            hls_playlist_length 10;
            hls_cleanup on;
            hls_continuous off;
            hls_nested off;
            hls_type live;
        }
    }
}


