# StreamPulse Nginx RTMP & FFmpeg Transcoding Module Configuration

rtmp {
    server {
        listen 1935 so_keepalive=on; # Standard RTMP port with OS TCP keepalive
        chunk_size 4096;
        ping 15s;
        ping_timeout 10s;

        # Primary Live Stream Ingest Application
        # OBS publishes to rtmp://server/ingest/<stream_key>
        application ingest {
            live on;
            record off;

            # Fast reconnect & cleanup optimization for dropped sockets
            drop_idle_publisher 10s;
            idle_streams off;
            exec_kill_signal term;

            # HTTP callbacks for StreamPulse server state tracking
            on_publish http://127.0.0.1:3000/api/rtmp/publish;
            on_publish_done http://127.0.0.1:3000/api/rtmp/publish_done;

            # Forward the incoming stream to the 'live' application for RTMP playback (IPv4 explicit loopback)
            push rtmp://127.0.0.1/live;

            # Bind transcoding process directly to the incoming publisher session via exec_publish
            exec_publish /usr/local/bin/transcode.sh $name;
        }

        # Standalone Live application for playback/distribution (No transcoding hooks, no circular locks)
        application live {
            live on;
            record off;
        }

        # Raw ingest application (optional, if you want direct playback without transcoding)
        application raw {
            live on;
            record off;
            
            # Enable HLS generation for raw input directly
            hls on;
            hls_path /var/www/hls/raw;
            hls_fragment 3;
            hls_playlist_length 60;
        }
    }
}

